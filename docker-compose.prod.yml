# G-RAG 本番用 Docker Compose
# 使い方: docker compose -f docker-compose.prod.yml --env-file .env up -d
# 前提: .env に JWT_SECRET（32文字以上）, DATABASE_URL（Postgres）を設定すること

version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-grag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-grag}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-grag} -d ${POSTGRES_DB:-grag}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-grag}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-grag}
      AUTH_MODE: ${AUTH_MODE:-demo}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      EMBEDDING_MODE: ${EMBEDDING_MODE:-demo}
      VECTOR_DB: ${VECTOR_DB:-memory}
      DATA_DIR: /app/data
      CHROMA_PERSIST_DIR: /app/data/chroma
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://web:3000}
      NODE_ENV: production
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:

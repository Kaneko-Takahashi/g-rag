<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Ribbon path (behind bubble) -->
  <path d="M 140 340 Q 140 180 260 160 Q 380 140 380 260 Q 380 340 320 360" stroke="url(#ribbon)" stroke-width="28" fill="none" stroke-linecap="round" filter="url(#shadow)"/>
  <!-- Blue node -->
  <circle cx="140" cy="340" r="24" fill="#2563eb" filter="url(#shadow)"/>
  <!-- Green node -->
  <circle cx="320" cy="360" r="24" fill="#34d399" filter="url(#shadow)"/>
  <!-- Speech bubble outline -->
  <g filter="url(#shadow)">
    <path d="M 160 120 L 400 120 L 400 280 L 320 280 L 260 340 L 260 280 L 160 280 Z" fill="none" stroke="white" stroke-width="16" stroke-linejoin="round"/>
    <!-- Three lines inside bubble -->
    <line x1="200" y1="180" x2="360" y2="180" stroke="white" stroke-width="12" stroke-linecap="round"/>
    <line x1="200" y1="220" x2="320" y2="220" stroke="white" stroke-width="12" stroke-linecap="round"/>
    <line x1="200" y1="260" x2="280" y2="260" stroke="white" stroke-width="12" stroke-linecap="round"/>
  </g>
</svg>
